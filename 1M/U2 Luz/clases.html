<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>U2-Luz</title>
    
    <!-- Archivos CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/theme/solarized.css" id="theme">
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="reveal">
    <img class="logo" src="../logo.png" alt="Logo Institución"/>
    <div class="slides">
        <section class="bg-cover">
            <img class="r-stretch" src="assets/difraccion.png"/>
            <h3>Luz</h3>
        </section>

        <section>
            <h3>Objetivo</h3>
            <p>Explicar la formación de imágenes en espejos a partir de la reflexión de la luz.</p>
        </section>
        <section>
           <simulador-espejos></simulador-espejos>
        </section>
    </div>
    </div>
    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/plugin/math/math.min.js"></script>
    <script src="../timer.js"></script>
    <script src="../../espejos.js"></script>
    <script>
        Reveal.initialize({
            hash: true,
            transition: 'fade',
            slideNumber: 'c/t',
            center: true,
            plugins: [ RevealMath.KaTeX ]
        });
    </script>
</body>
</html>
